<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FLAG">
<meta name="theme-color" content="#14233C">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<title>FLAG</title>
<style>
:root { color-scheme: light dark; --bg: #f2f2f7; --ink: #000; --muted: #6d6d72; --line: #c6c6c8; --accent: #007aff; --surface: #fff; --err: #ff3b30 }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #fff; --muted: #98989f; --line: #38383a; --accent: #0a84ff; --surface: #1c1c1e; --err: #ff453a } }
* { box-sizing: border-box }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; padding: max(24px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)) }
form { width: 100%; max-width: 380px; min-height: calc(100dvh - 60px); display: grid; grid-template-rows: 1fr auto; gap: 24px }
form[hidden] { display: none }
.top { display: grid; justify-items: center; align-content: center; gap: 14px; text-align: center }
.mk svg { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 12px 32px rgba(20,35,60,.28) }
h1 { margin: 0; font-size: 56px; font-weight: 800; letter-spacing: .06em; line-height: 1 }
.sub { margin-top: -8px; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted) }
.acro { font-size: 19px; color: var(--muted); line-height: 1.35 } .acro b { color: var(--accent); font-weight: 800; font-size: 21px }
.bot { display: grid; gap: 12px }
input { width: 100%; font: inherit; font-size: 18px; min-height: 54px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
button { font: inherit; font-weight: 700; font-size: 19px; min-height: 60px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; cursor: pointer }
button:disabled { opacity: .6 }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,122,255,.25) }
p { margin: 0; color: var(--muted); font-size: 15px; text-align: center }
.err { color: var(--err); font-weight: 600 }
#wait { font-size: 17px }
.tag { font-size: 20px; color: var(--muted); font-weight: 500 } .tag b { color: var(--accent); font-weight: 800 }
.pwwrap { position: relative; display: block } .pwwrap input { padding-right: 52px !important; width: 100% }
.eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; background: none !important; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; min-height: 0 !important }
.eye .sl { display: none } .eye[aria-pressed="true"] .sl { display: inline } .eye[aria-pressed="true"] { color: var(--accent) }
/* lock screen backdrop: blueprint grid + house line drawing + slow scan line */
.bp { --bpbg: #eef3fa; --bpln: rgba(0,90,200,.07); --bpln2: rgba(0,90,200,.13); --bpart: rgba(0,90,200,.28); --bpscan: rgba(0,122,255,.10);
  background-color: var(--bpbg) !important;
  background-image: linear-gradient(var(--bpln2) 1px, transparent 1px), linear-gradient(90deg, var(--bpln2) 1px, transparent 1px), linear-gradient(var(--bpln) 1px, transparent 1px), linear-gradient(90deg, var(--bpln) 1px, transparent 1px) !important;
  background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px !important; background-position: center center !important; overflow: hidden }
.bp .bpart { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--bpart); pointer-events: none; z-index: 0 }
.bp::after { content: ""; position: absolute; left: 0; right: 0; height: 140px; top: -140px; pointer-events: none; z-index: 0; background: linear-gradient(transparent, var(--bpscan) 85%, rgba(0,122,255,.22) 99%, transparent); animation: bpscan 7s linear infinite }
@keyframes bpscan { to { transform: translateY(calc(100vh + 140px)) } }
@media (prefers-reduced-motion: reduce) { .bp::after { animation: none; display: none } }
.bp > *:not(.bpart) { position: relative; z-index: 1 }
@media (prefers-color-scheme: dark) {  .bp { --bpbg: #0a1422; --bpln: rgba(100,170,255,.06); --bpln2: rgba(100,170,255,.12); --bpart: rgba(120,185,255,.30); --bpscan: rgba(80,160,255,.10) } }
body.bp { position: relative; min-height: 100dvh }
/* v61: flat navy, big centered logo (Jeff 2026-11-17) */
body.lkbg { --bg: #14233C; --ink: #fff; --muted: rgba(255,255,255,.68); --line: rgba(255,255,255,.22); --accent: #ffc72c; --surface: rgba(255,255,255,.08); background: var(--bg) }
@media (prefers-color-scheme: dark) { body.lkbg { --bg: #0b1526 } }
body.lkbg button, body.lkbg input { border-radius: 6px } body.lkbg button { color: #14233c }
body.lkbg .mk svg { width: 168px; height: 168px; border-radius: 38px; box-shadow: none; outline: 1px solid rgba(255,255,255,.14) }
body.lkbg h1 { margin-top: 6px }
@media (max-height: 620px) { body.lkbg .mk svg { width: 120px; height: 120px; border-radius: 28px } }
</style>
</head><body class="lkbg">
<form id="f" hidden autocomplete="off">
  <div class="top"><div class="mk"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="36" fill="#14233C"/><rect x="44" y="32" width="12" height="118" rx="6" fill="#FFFFFF"/><path d="M56 40C84 28 108 54 142 40V100C108 114 84 88 56 100Z" fill="#FFC72C"/><g fill="#14233C"><rect x="78" y="62" width="10" height="22" rx="5"/><rect x="94" y="54" width="10" height="38" rx="5"/><rect x="110" y="62" width="10" height="22" rx="5"/></g></svg></div><h1>FLAG</h1><div class="acro"><span><b>F</b>ind</span> · <span><b>L</b>og</span> · <span><b>A</b>pprove</span> · <span><b>G</b>enerate</span></div><div class="sub">Inspection Software</div><div class="tag">Just <b>FLAG</b> it!</div></div>
  <div class="bot"><span class="pwwrap"><input type="password" id="pw" placeholder="Passphrase" autocomplete="current-password" enterkeyhint="go"><button type="button" class="eye" data-eye aria-label="Show passphrase" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="sl" d="M4 4l16 16"/></svg></button></span>
  <button id="go" type="submit">Unlock</button>
  <p id="msg"></p></div>
</form>
<p id="wait">Opening…</p>
<script>
document.addEventListener("click", (e) => { // show/hide passphrase
  const b = e.target.closest && e.target.closest("[data-eye]"); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const i = b.parentElement.querySelector("input"); const show = i.type === "password";
  i.type = show ? "text" : "password"; b.setAttribute("aria-pressed", String(show)); b.setAttribute("aria-label", show ? "Hide passphrase" : "Show passphrase"); i.focus();
}, true);
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const store = (() => {
  const open = () => new Promise((res, rej) => { const r = indexedDB.open("snap-lock", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("k", mode); const q = fn(t.objectStore("k")); t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); }); };
  return { get: (k) => run("readonly", (s) => s.get(k)), put: (k, v) => run("readwrite", (s) => s.put(v, k)) };
})();
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
const getJSON = async (n) => { const r = await fetch(n, { cache: "no-cache" }); if (!r.ok) throw new Error(n); return r.json(); };
async function unseal(pass) {
  const k = (await getJSON("key.enc")).key;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const wk = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: ub(k.salt), iterations: k.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pk8 = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(k.iv) }, wk, ub(k.ct));
  return crypto.subtle.importKey("pkcs8", pk8, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]); // can't be copied off the phone
}
async function openApp(priv) {
  const e = await getJSON("app.enc");
  const epub = await crypto.subtle.importKey("spki", ub(e.epub), { name: "ECDH", namedCurve: "P-256" }, false, []);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: epub }, priv, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(e.iv) }, key, ub(e.ct));
  const text = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const b = JSON.parse(text);
  window.__SNAP_FILES = b.files;
  document.open(); document.write(b.html); document.close();
}
async function start() {
  let priv = null;
  try { priv = await store.get("priv"); } catch (e) {}
  if (priv) {
    try { await openApp(priv); return; } catch (e) { $("#msg").textContent = "Couldn't open with the saved key. Enter your passphrase."; }
  }
  $("#wait").hidden = true; $("#f").hidden = false; $("#pw").focus();
}
$("#f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const pw = $("#pw").value; if (!pw) return;
  $("#go").disabled = true; $("#go").textContent = "Unlocking…"; $("#msg").textContent = ""; $("#msg").className = "";
  let priv;
  try { priv = await unseal(pw); }
  catch (e) { $("#go").disabled = false; $("#go").textContent = "Unlock"; $("#msg").className = "err"; $("#msg").textContent = navigator.onLine === false && !(e instanceof DOMException) ? "Needs signal the first time." : "Wrong passphrase."; return; }
  try { await store.put("priv", priv); } catch (e) {}
  try { sessionStorage.setItem("flag-firstunlock", "1"); } catch (e) {} // the app then offers Face ID
  window.__FLAG_PASS = pw; // a computer's FLAG opens its saved inspections with it (read once, then removed)
  try { await openApp(priv); }
  catch (e) { $("#go").disabled = false; $("#go").textContent = "Unlock"; $("#msg").className = "err"; $("#msg").textContent = "Couldn't open the app. Try again with signal."; }
});
start();
})();
</script>
</body></html>

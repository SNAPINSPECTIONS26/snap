<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FLAG">
<meta name="theme-color" content="#14233C">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<title>FLAG</title>
<style>
:root { color-scheme: light dark; --bg: #f2f2f7; --ink: #000; --muted: #6d6d72; --line: #c6c6c8; --accent: #007aff; --surface: #fff; --err: #ff3b30 }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #fff; --muted: #98989f; --line: #38383a; --accent: #0a84ff; --surface: #1c1c1e; --err: #ff453a } }
* { box-sizing: border-box }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; padding: max(24px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)) }
form { width: 100%; max-width: 380px; min-height: calc(100dvh - 60px); display: grid; grid-template-rows: 1fr auto; gap: 24px }
form[hidden] { display: none }
.top { display: grid; justify-items: center; align-content: center; gap: 14px; text-align: center }
.mk svg { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 12px 32px rgba(20,35,60,.28) }
h1 { margin: 0; font-size: 56px; font-weight: 800; letter-spacing: .06em; line-height: 1 }
.acro { font-size: 19px; color: var(--muted); line-height: 1.35 } .acro b { color: var(--accent); font-weight: 800; font-size: 21px }
.bot { display: grid; gap: 12px }
input { width: 100%; font: inherit; font-size: 18px; min-height: 54px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
button { font: inherit; font-weight: 700; font-size: 19px; min-height: 60px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; cursor: pointer }
button:disabled { opacity: .6 }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,122,255,.25) }
p { margin: 0; color: var(--muted); font-size: 15px; text-align: center }
.err { color: var(--err); font-weight: 600 }
#wait { font-size: 17px }
.tag { font-size: 20px; color: var(--muted); font-weight: 500 } .tag b { color: var(--accent); font-weight: 800 }
</style>
</head><body>
<form id="f" hidden autocomplete="off">
  <div class="top"><div class="mk"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="36" fill="#14233C"/><rect x="44" y="32" width="12" height="118" rx="6" fill="#FFFFFF"/><path d="M56 40C84 28 108 54 142 40V100C108 114 84 88 56 100Z" fill="#FFC72C"/><g fill="#14233C"><rect x="78" y="62" width="10" height="22" rx="5"/><rect x="94" y="54" width="10" height="38" rx="5"/><rect x="110" y="62" width="10" height="22" rx="5"/></g></svg></div><h1>FLAG</h1><div class="acro"><span><b>F</b>ind</span> · <span><b>L</b>og</span> · <span><b>A</b>pprove</span> · <span><b>G</b>enerate</span></div><div class="tag">Just <b>FLAG</b> it.</div></div>
  <div class="bot"><input type="password" id="pw" placeholder="Passphrase" autocomplete="current-password" enterkeyhint="go">
  <button id="go" type="submit">Unlock</button>
  <p id="msg"></p></div>
</form>
<p id="wait">Opening…</p>
<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const store = (() => {
  const open = () => new Promise((res, rej) => { const r = indexedDB.open("snap-lock", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("k", mode); const q = fn(t.objectStore("k")); t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); }); };
  return { get: (k) => run("readonly", (s) => s.get(k)), put: (k, v) => run("readwrite", (s) => s.put(v, k)) };
})();
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
const getJSON = async (n) => { const r = await fetch(n, { cache: "no-cache" }); if (!r.ok) throw new Error(n); return r.json(); };
async function unseal(pass) {
  const k = (await getJSON("key.enc")).key;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const wk = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: ub(k.salt), iterations: k.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pk8 = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(k.iv) }, wk, ub(k.ct));
  return crypto.subtle.importKey("pkcs8", pk8, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]); // can't be copied off the phone
}
async function openApp(priv) {
  const e = await getJSON("app.enc");
  const epub = await crypto.subtle.importKey("spki", ub(e.epub), { name: "ECDH", namedCurve: "P-256" }, false, []);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: epub }, priv, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(e.iv) }, key, ub(e.ct));
  const text = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const b = JSON.parse(text);
  window.__SNAP_FILES = b.files;
  document.open(); document.write(b.html); document.close();
}
async function start() {
  let priv = null;
  try { priv = await store.get("priv"); } catch (e) {}
  if (priv) {
    try { await openApp(priv); return; } catch (e) { $("#msg").textContent = "Couldn't open with the saved key. Enter your passphrase."; }
  }
  $("#wait").hidden = true; $("#f").hidden = false; $("#pw").focus();
}
$("#f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const pw = $("#pw").value; if (!pw) return;
  $("#go").disabled = true; $("#go").textContent = "Unlocking…"; $("#msg").textContent = ""; $("#msg").className = "";
  let priv;
  try { priv = await unseal(pw); }
  catch (e) { $("#go").disabled = false; $("#go").textContent = "Unlock"; $("#msg").className = "err"; $("#msg").textContent = navigator.onLine === false && !(e instanceof DOMException) ? "Needs signal the first time." : "Wrong passphrase."; return; }
  try { await store.put("priv", priv); } catch (e) {}
  try { await openApp(priv); }
  catch (e) { $("#go").disabled = false; $("#go").textContent = "Unlock"; $("#msg").className = "err"; $("#msg").textContent = "Couldn't open the app. Try again with signal."; }
});
start();
})();
</script>
</body></html>
